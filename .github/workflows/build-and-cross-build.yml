name: Build And Cross-Build

on:
  pull_request:
  push:

jobs:
  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ~/.cache/ccache

    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-linux-build-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-linux-build-ccache-

      - name: Restore build directory cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-linux-build-dir-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-linux-build-dir-

      - name: Install dependencies
        # Keep aligned with docs/README.Ubuntu.md and sonarqube workflow.
        run: |
          sudo apt update
          sudo apt install -y debhelper autoconf automake autopoint gettext autotools-dev cmake curl gawk gcc gdc gperf libasound2-dev libass-dev libavahi-client-dev libavahi-common-dev libbluetooth-dev libbluray-dev libbz2-dev libcdio-dev libp8-platform-dev libcrossguid-dev libcurl4-openssl-dev libcwiid-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev libenca-dev libexiv2-dev libflac-dev libfmt-dev libfontconfig-dev libfreetype6-dev libfribidi-dev libfstrcmp-dev libgcrypt-dev libgif-dev libgles2-mesa-dev libgl1-mesa-dev libglu1-mesa-dev libgnutls28-dev libgpg-error-dev libiso9660-dev libjpeg-dev liblcms2-dev libltdl-dev liblzo2-dev libmicrohttpd-dev libmariadb-dev libnfs-dev libogg-dev libpcre2-dev libplist-dev libpng-dev libpulse-dev libshairplay-dev libsmbclient-dev libspdlog-dev libsqlite3-dev libssl-dev libtag1-dev libtiff5-dev libtinyxml-dev libtinyxml2-dev libtool libudev-dev libunistring-dev libva-dev libvdpau-dev libvorbis-dev libxmu-dev libxrandr-dev libxslt1-dev libxt-dev lsb-release meson nasm ninja-build nlohmann-json3-dev python3-dev python3-pil python3-pip swig unzip uuid-dev zip zlib1g-dev
          sudo apt install -y libcec-dev liblirc-dev libflatbuffers-dev
          sudo apt install -y libglew-dev libwayland-dev libxkbcommon-dev waylandpp-dev wayland-protocols
          sudo apt install -y libgbm-dev libinput-dev libsndio-dev libdisplay-info-dev
          sudo apt install -y ccache

      - name: Configure ccache
        run: |
          ccache --max-size=2G

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DAPP_RENDER_SYSTEM=gl \
            -DENABLE_INTERNAL_FFMPEG=ON \
            -DENABLE_CCACHE=ON \
            -DENABLE_TESTING=OFF

      - name: Build
        run: |
          cmake --build build --parallel 2

  linux-full-build-no-system-deps:
    name: Linux Full Build (No System Deps)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore linux superbuild cache
        uses: actions/cache@v4
        with:
          path: |
            build-linux-superbuild/depends
            build-linux-superbuild/kodi
          key: ${{ runner.os }}-linux-superbuild-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-linux-superbuild-

      - name: Configure top-level superbuild for linux
        run: |
          cmake -S . -B build-linux-superbuild -G Ninja \
            -DKODI_SUPERBUILD_DEPENDS=ON \
            -DKODI_DEPENDS_HOST=x86_64-linux-gnu \
            -DKODI_DEPENDS_TOOLCHAIN=/usr \
            -DKODI_DEPENDS_RENDER_SYSTEM=gl

      - name: Build Kodi via superbuild
        run: |
          cmake --build build-linux-superbuild --target kodi-core --parallel 2

  linux-superbuild-with-addons:
    name: Linux Superbuild + Add-ons (Staged)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Restore linux addon superbuild cache
        uses: actions/cache@v4
        with:
          path: |
            build-linux-superbuild-addons/depends
            build-linux-superbuild-addons/kodi
            build-linux-superbuild-addons/addons-build
            build-linux-superbuild-addons/addons-work
          key: ${{ runner.os }}-linux-superbuild-addons-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-linux-superbuild-addons-

      - name: Configure top-level superbuild for linux with add-ons
        run: |
          cmake -S . -B build-linux-superbuild-addons -G Ninja \
            -DKODI_SUPERBUILD_DEPENDS=ON \
            -DKODI_SUPERBUILD_ADDONS=ON \
            -DKODI_DEPENDS_HOST=x86_64-linux-gnu \
            -DKODI_DEPENDS_TOOLCHAIN=/usr \
            -DKODI_DEPENDS_RENDER_SYSTEM=gl \
            -DKODI_ADDONS_TO_BUILD=pvr.iptvsimple \
            -DKODI_ADDONS_BUILD_TARGET=all

      - name: Build Kodi and staged add-ons via superbuild
        run: |
          cmake --build build-linux-superbuild-addons --target kodi-e2e --parallel 2

      - name: Upload staged add-on artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-superbuild-addons-artifacts
          path: |
            build-linux-superbuild-addons/addons
            build-linux-superbuild-addons/addons-build/.success
            build-linux-superbuild-addons/addons-build/.failure
          if-no-files-found: ignore

  macos-build:
    name: macOS Build
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Restore macOS superbuild cache
        uses: actions/cache@v4
        with:
          path: |
            build-macos-superbuild/depends
            build-macos-superbuild/kodi
          key: ${{ runner.os }}-macos-superbuild-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-macos-superbuild-

      - name: Install depends bootstrap requirements
        run: |
          brew install autoconf automake libtool gettext pkg-config gnu-tar gnu-sed

      - name: Configure top-level superbuild for macOS
        run: |
          HOST_ARCH=$(uname -m)
          if [ "$HOST_ARCH" = "arm64" ]; then
            HOST_TRIPLET=aarch64-apple-darwin
          else
            HOST_TRIPLET=x86_64-apple-darwin
          fi
          cmake -S . -B build-macos-superbuild -G Ninja \
            -DKODI_SUPERBUILD_DEPENDS=ON \
            -DKODI_DEPENDS_HOST="$HOST_TRIPLET" \
            -DKODI_DEPENDS_TARGET_PLATFORM=macos

      - name: Build Kodi via superbuild
        run: |
          cmake --build build-macos-superbuild --target kodi-core --parallel 2

  macos-superbuild-with-addons:
    name: macOS Superbuild + Add-ons (Staged)
    runs-on: macos-14
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Restore macOS addon superbuild cache
        uses: actions/cache@v4
        with:
          path: |
            build-macos-superbuild-addons/depends
            build-macos-superbuild-addons/kodi
            build-macos-superbuild-addons/addons-build
            build-macos-superbuild-addons/addons-work
          key: ${{ runner.os }}-macos-superbuild-addons-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-macos-superbuild-addons-

      - name: Install depends bootstrap requirements
        run: |
          brew install autoconf automake libtool gettext pkg-config gnu-tar gnu-sed

      - name: Configure top-level superbuild for macOS with add-ons
        run: |
          HOST_ARCH=$(uname -m)
          if [ "$HOST_ARCH" = "arm64" ]; then
            HOST_TRIPLET=aarch64-apple-darwin
          else
            HOST_TRIPLET=x86_64-apple-darwin
          fi
          cmake -S . -B build-macos-superbuild-addons -G Ninja \
            -DKODI_SUPERBUILD_DEPENDS=ON \
            -DKODI_SUPERBUILD_ADDONS=ON \
            -DKODI_DEPENDS_HOST="$HOST_TRIPLET" \
            -DKODI_DEPENDS_TARGET_PLATFORM=macos \
            -DKODI_ADDONS_TO_BUILD=pvr.iptvsimple \
            -DKODI_ADDONS_BUILD_TARGET=all

      - name: Build Kodi and staged add-ons via superbuild
        run: |
          cmake --build build-macos-superbuild-addons --target kodi-e2e --parallel 2

      - name: Upload staged macOS add-on artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-superbuild-addons-artifacts
          path: |
            build-macos-superbuild-addons/addons
            build-macos-superbuild-addons/addons-build/.success
            build-macos-superbuild-addons/addons-build/.failure
          if-no-files-found: ignore

  windows-build:
    name: Windows Build + Add-ons (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore windows dependency cache
        uses: actions/cache@v4
        with:
          path: |
            project/BuildDependencies/downloads
            project/BuildDependencies/downloads2
            project/BuildDependencies/msys64
          key: ${{ runner.os }}-windows-x64-build-deps-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-windows-x64-build-deps-

      - name: Download windows dependencies (x64)
        shell: cmd
        run: |
          tools\buildsteps\windows\x64\download-dependencies.bat

      - name: Prepare windows msys2 toolchain (x64)
        shell: cmd
        run: |
          tools\buildsteps\windows\x64\download-msys2.bat sh

      - name: Configure windows x64 build
        shell: cmd
        run: |
          cmake -S . -B build-windows-x64 -G "Visual Studio 17 2022" -A x64 -T host=x64 -DENABLE_TESTING=OFF

      - name: Build Kodi app (windows x64)
        shell: cmd
        run: |
          cmake --build build-windows-x64 --config Release --parallel 2

      - name: Build representative windows add-on
        shell: cmd
        run: |
          tools\buildsteps\windows\x64\make-addons.bat package pvr.iptvsimple

      - name: Upload windows x64 build and add-on artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build-artifacts
          path: |
            build-windows-x64/Release
            project/Win32BuildSetup/BUILD_WIN32/addons
            cmake/addons/.success
            cmake/addons/.failure
            cmake/addons/make-addons.error
          if-no-files-found: ignore

  windows-uwp-build:
    name: Windows UWP Build + Add-ons (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore windows uwp dependency cache
        uses: actions/cache@v4
        with:
          path: |
            project/BuildDependencies/downloads
            project/BuildDependencies/downloads2
            project/BuildDependencies/msys64
          key: ${{ runner.os }}-windows-uwp-x64-build-deps-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-windows-uwp-x64-build-deps-

      - name: Download windows dependencies (uwp x64)
        shell: cmd
        run: |
          tools\buildsteps\windows\x64-uwp\download-dependencies.bat

      - name: Prepare windows msys2 toolchain (uwp x64)
        shell: cmd
        run: |
          tools\buildsteps\windows\x64-uwp\download-msys2.bat sh

      - name: Configure windows uwp x64 build
        shell: cmd
        run: |
          cmake -S . -B build-windows-uwp -G "Visual Studio 17 2022" -A x64 -T host=x64 -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0 -DENABLE_TESTING=OFF

      - name: Build Kodi app (windows uwp x64)
        shell: cmd
        run: |
          cmake --build build-windows-uwp --config Release --parallel 2

      - name: Build representative windows uwp add-on
        shell: cmd
        run: |
          tools\buildsteps\windows\x64-uwp\make-addons.bat package pvr.iptvsimple

      - name: Upload windows uwp build and add-on artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-uwp-x64-build-artifacts
          path: |
            build-windows-uwp/AppPackages
            project/Win32BuildSetup/BUILD_WIN32/addons
            cmake/addons/.success
            cmake/addons/.failure
            cmake/addons/make-addons.error
          if-no-files-found: ignore

  windows-superbuild-depends-x64:
    name: Windows Superbuild Depends (x64, Experimental)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Restore windows superbuild dependency cache
        uses: actions/cache@v4
        with:
          path: |
            project/BuildDependencies/downloads
            project/BuildDependencies/downloads2
            project/BuildDependencies/msys64
            project/BuildDependencies/tools
            project/BuildDependencies/x64
          key: ${{ runner.os }}-windows-superbuild-x64-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-windows-superbuild-x64-

      - name: Prepare windows msys2 toolchain (x64)
        shell: cmd
        run: |
          tools\buildsteps\windows\x64\download-msys2.bat sh

      - name: Configure windows x64 superbuild depends
        shell: cmd
        run: |
          cmake -S . -B build-windows-superbuild-x64 -G "Visual Studio 17 2022" -A x64 -T host=x64 -DENABLE_TESTING=OFF -DKODI_SUPERBUILD_DEPENDS=ON -DKODI_SUPERBUILD_WINDOWS_EXPERIMENTAL=ON -DKODI_SUPERBUILD_WINDOWS_ARCH=x64 -DKODI_DEPENDS_WINDOWS_PROFILE=minimal

      - name: Build windows x64 depends graph from source
        shell: cmd
        run: |
          cmake --build build-windows-superbuild-x64 --target kodi-depends-target --parallel 2

      - name: Upload windows x64 superbuild diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-superbuild-x64-artifacts
          path: |
            build-windows-superbuild-x64/depends
            project/BuildDependencies/x64
            project/BuildDependencies/tools
          if-no-files-found: ignore

  windows-superbuild-depends-win32:
    name: Windows Superbuild Depends (win32, Experimental)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Restore windows superbuild win32 cache
        uses: actions/cache@v4
        with:
          path: |
            project/BuildDependencies/downloads
            project/BuildDependencies/downloads2
            project/BuildDependencies/msys64
            project/BuildDependencies/tools
            project/BuildDependencies/win32
          key: ${{ runner.os }}-windows-superbuild-win32-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-windows-superbuild-win32-

      - name: Prepare windows msys2 toolchain (win32)
        shell: cmd
        run: |
          tools\buildsteps\windows\win32\download-msys2.bat sh

      - name: Configure windows win32 superbuild depends
        shell: cmd
        run: |
          cmake -S . -B build-windows-superbuild-win32 -G "Visual Studio 17 2022" -A Win32 -T host=x64 -DENABLE_TESTING=OFF -DKODI_SUPERBUILD_DEPENDS=ON -DKODI_SUPERBUILD_WINDOWS_EXPERIMENTAL=ON -DKODI_SUPERBUILD_WINDOWS_ARCH=win32 -DKODI_DEPENDS_WINDOWS_PROFILE=minimal

      - name: Build windows win32 configure target
        shell: cmd
        run: |
          cmake --build build-windows-superbuild-win32 --target kodi-depends-configure --parallel 2

  windows-superbuild-depends-arm64:
    name: Windows Superbuild Depends (arm64, Experimental)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Restore windows superbuild arm64 cache
        uses: actions/cache@v4
        with:
          path: |
            project/BuildDependencies/downloads
            project/BuildDependencies/downloads2
            project/BuildDependencies/msys64
            project/BuildDependencies/tools
            project/BuildDependencies/arm64
          key: ${{ runner.os }}-windows-superbuild-arm64-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-windows-superbuild-arm64-

      - name: Prepare windows msys2 toolchain (arm64)
        shell: cmd
        run: |
          tools\buildsteps\windows\arm64\download-msys2.bat sh

      - name: Configure windows arm64 superbuild depends
        shell: cmd
        run: |
          cmake -S . -B build-windows-superbuild-arm64 -G "Visual Studio 17 2022" -A ARM64 -T host=x64 -DENABLE_TESTING=OFF -DKODI_SUPERBUILD_DEPENDS=ON -DKODI_SUPERBUILD_WINDOWS_EXPERIMENTAL=ON -DKODI_SUPERBUILD_WINDOWS_ARCH=arm64 -DKODI_DEPENDS_WINDOWS_PROFILE=minimal

      - name: Build windows arm64 configure target
        shell: cmd
        run: |
          cmake --build build-windows-superbuild-arm64 --target kodi-depends-configure --parallel 2

  windows-superbuild-depends-uwp-x64:
    name: Windows Superbuild Depends (UWP x64, Experimental)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Restore windows superbuild uwp cache
        uses: actions/cache@v4
        with:
          path: |
            project/BuildDependencies/downloads
            project/BuildDependencies/downloads2
            project/BuildDependencies/msys64
            project/BuildDependencies/tools
            project/BuildDependencies/win10-x64
          key: ${{ runner.os }}-windows-superbuild-uwp-x64-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-windows-superbuild-uwp-x64-

      - name: Prepare windows msys2 toolchain (uwp x64)
        shell: cmd
        run: |
          tools\buildsteps\windows\x64-uwp\download-msys2.bat sh

      - name: Configure windows uwp x64 superbuild depends
        shell: cmd
        run: |
          cmake -S . -B build-windows-superbuild-uwp -G "Visual Studio 17 2022" -A x64 -T host=x64 -DENABLE_TESTING=OFF -DKODI_SUPERBUILD_DEPENDS=ON -DKODI_SUPERBUILD_WINDOWS_EXPERIMENTAL=ON -DKODI_SUPERBUILD_WINDOWS_ARCH=x64 -DKODI_SUPERBUILD_WINDOWS_UWP=ON -DKODI_DEPENDS_WINDOWS_PROFILE=minimal

      - name: Build windows uwp configure target
        shell: cmd
        run: |
          cmake --build build-windows-superbuild-uwp --target kodi-depends-configure --parallel 2

  macos-tvos-cross-build:
    name: macOS tvOS Cross-Build
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Restore tvOS superbuild cache
        uses: actions/cache@v4
        with:
          path: |
            build-tvos-superbuild/depends
            build-tvos-superbuild/kodi
          key: ${{ runner.os }}-tvos-superbuild-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tvos-superbuild-

      - name: Install depends bootstrap requirements
        run: |
          brew install autoconf automake libtool gettext pkg-config gnu-tar gnu-sed

      - name: Configure top-level superbuild for tvOS
        run: |
          HOST_ARCH=$(uname -m)
          if [ "$HOST_ARCH" = "arm64" ]; then
            HOST_TRIPLET=aarch64-apple-darwin
          else
            HOST_TRIPLET=x86_64-apple-darwin
          fi
          cmake -S . -B build-tvos-superbuild -G Ninja \
            -DKODI_SUPERBUILD_DEPENDS=ON \
            -DKODI_DEPENDS_HOST="$HOST_TRIPLET" \
            -DKODI_DEPENDS_TARGET_PLATFORM=tvos \
            -DKODI_DEPENDS_SDK_VERSION=17.2

      - name: Build Kodi via superbuild
        run: |
          cmake --build build-tvos-superbuild --target kodi-core --parallel 2

  macos-tvos-superbuild-with-addons:
    name: macOS tvOS Superbuild + Add-ons (Staged)
    runs-on: macos-14
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Restore tvOS addon superbuild cache
        uses: actions/cache@v4
        with:
          path: |
            build-tvos-superbuild-addons/depends
            build-tvos-superbuild-addons/kodi
            build-tvos-superbuild-addons/addons-build
            build-tvos-superbuild-addons/addons-work
          key: ${{ runner.os }}-tvos-superbuild-addons-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tvos-superbuild-addons-

      - name: Install depends bootstrap requirements
        run: |
          brew install autoconf automake libtool gettext pkg-config gnu-tar gnu-sed

      - name: Configure top-level superbuild for tvOS with add-ons
        run: |
          HOST_ARCH=$(uname -m)
          if [ "$HOST_ARCH" = "arm64" ]; then
            HOST_TRIPLET=aarch64-apple-darwin
          else
            HOST_TRIPLET=x86_64-apple-darwin
          fi
          cmake -S . -B build-tvos-superbuild-addons -G Ninja \
            -DKODI_SUPERBUILD_DEPENDS=ON \
            -DKODI_SUPERBUILD_ADDONS=ON \
            -DKODI_DEPENDS_HOST="$HOST_TRIPLET" \
            -DKODI_DEPENDS_TARGET_PLATFORM=tvos \
            -DKODI_DEPENDS_SDK_VERSION=17.2 \
            -DKODI_ADDONS_TO_BUILD=pvr.iptvsimple \
            -DKODI_ADDONS_BUILD_TARGET=all

      - name: Build Kodi and staged add-ons via superbuild
        run: |
          cmake --build build-tvos-superbuild-addons --target kodi-e2e --parallel 2

      - name: Upload staged tvOS add-on artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-superbuild-addons-artifacts
          path: |
            build-tvos-superbuild-addons/addons
            build-tvos-superbuild-addons/addons-build/.success
            build-tvos-superbuild-addons/addons-build/.failure
          if-no-files-found: ignore

  wasm-cross-build:
    name: WASM Cross-Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore wasm superbuild cache
        uses: actions/cache@v4
        with:
          path: |
            build-wasm/depends
            build-wasm/kodi
          key: ${{ runner.os }}-wasm-superbuild-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-wasm-superbuild-

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.6

      - name: Install depends bootstrap requirements
        run: |
          sudo apt update
          sudo apt install -y autoconf automake autopoint gettext autotools-dev cmake curl gawk libtool make ninja-build pkg-config python3 libcurl4-openssl-dev zlib1g-dev

      - name: Configure top-level superbuild for wasm
        run: |
          TOOLCHAIN_PATH=$(dirname "$(dirname "$(dirname "$(command -v emcc)")")")
          cmake -S . -B build-wasm -G Ninja \
            -DKODI_SUPERBUILD_DEPENDS=ON \
            -DKODI_DEPENDS_HOST=wasm32-unknown-emscripten \
            -DKODI_DEPENDS_TARGET_PLATFORM=wasm \
            -DKODI_DEPENDS_TOOLCHAIN="$TOOLCHAIN_PATH"

      - name: Build Kodi via superbuild
        run: |
          cmake --build build-wasm --target kodi-core --parallel 2

  wasm-superbuild-with-addons:
    name: WASM Superbuild + Add-ons (Staged)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Restore wasm addon superbuild cache
        uses: actions/cache@v4
        with:
          path: |
            build-wasm-addons/depends
            build-wasm-addons/kodi
            build-wasm-addons/addons-build
            build-wasm-addons/addons-work
          key: ${{ runner.os }}-wasm-superbuild-addons-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-wasm-superbuild-addons-

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.6

      - name: Install depends bootstrap requirements
        run: |
          sudo apt update
          sudo apt install -y autoconf automake autopoint gettext autotools-dev cmake curl gawk libtool make ninja-build pkg-config python3 libcurl4-openssl-dev zlib1g-dev

      - name: Configure top-level superbuild for wasm with add-ons
        run: |
          TOOLCHAIN_PATH=$(dirname "$(dirname "$(dirname "$(command -v emcc)")")")
          cmake -S . -B build-wasm-addons -G Ninja \
            -DKODI_SUPERBUILD_DEPENDS=ON \
            -DKODI_SUPERBUILD_ADDONS=ON \
            -DKODI_DEPENDS_HOST=wasm32-unknown-emscripten \
            -DKODI_DEPENDS_TARGET_PLATFORM=wasm \
            -DKODI_DEPENDS_TOOLCHAIN="$TOOLCHAIN_PATH" \
            -DKODI_ADDONS_TO_BUILD=pvr.iptvsimple \
            -DKODI_ADDONS_PACKAGE_ZIP=OFF

      - name: Build Kodi and staged add-ons via superbuild
        run: |
          cmake --build build-wasm-addons --target kodi-e2e --parallel 2

      - name: Upload staged wasm add-on artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-superbuild-addons-artifacts
          path: |
            build-wasm-addons/addons
            build-wasm-addons/addons-build/.success
            build-wasm-addons/addons-build/.failure
          if-no-files-found: ignore

  android-cross-build:
    name: Android Cross-Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore android superbuild cache
        uses: actions/cache@v4
        with:
          path: |
            build-android/depends
            build-android/kodi
          key: ${{ runner.os }}-android-superbuild-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-superbuild-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"

      - name: Install depends bootstrap requirements
        run: |
          sudo apt update
          sudo apt install -y autoconf automake autopoint gettext autotools-dev cmake curl gawk libtool make ninja-build pkg-config python3 libcurl4-openssl-dev zlib1g-dev

      - name: Configure top-level superbuild for android arm64
        env:
          ANDROID_NDK_VERSION: 28.2.13676358
          ANDROID_NDK_API: "24"
        run: |
          cmake -S . -B build-android -G Ninja \
            -DKODI_SUPERBUILD_DEPENDS=ON \
            -DKODI_DEPENDS_HOST=aarch64-linux-android \
            -DKODI_DEPENDS_SDK_PATH="$ANDROID_HOME" \
            -DKODI_DEPENDS_NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            -DKODI_DEPENDS_NDK_API="$ANDROID_NDK_API"

      - name: Build Kodi via superbuild
        run: |
          cmake --build build-android --target kodi-core --parallel 2

  android-superbuild-with-addons:
    name: Android Superbuild + Add-ons (Staged)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Restore android addon superbuild cache
        uses: actions/cache@v4
        with:
          path: |
            build-android-addons/depends
            build-android-addons/kodi
            build-android-addons/addons-build
            build-android-addons/addons-work
          key: ${{ runner.os }}-android-superbuild-addons-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-superbuild-addons-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"

      - name: Install depends bootstrap requirements
        run: |
