name: wasm

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      EMSDK_VERSION: "5.0.4"
      WASM_DEPENDS_PREFIX: /tmp/kodi-wasm-depends

    steps:
    - name: Checkout
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        fetch-depth: 0
    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
      with:
        key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf automake autopoint libtool libtool-bin \
          cmake curl gawk gperf gettext \
          m4 meson nasm ninja-build pkg-config \
          python3-dev python3-pil \
          zip unzip
    - name: Setup Python
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: '3.12'
    - name: Cache Emscripten SDK
      id: cache-emsdk
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ~/emsdk
        key: emsdk-${{ env.EMSDK_VERSION }}
    - name: Install Emscripten SDK
      if: steps.cache-emsdk.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
        cd ~/emsdk
        ./emsdk install ${{ env.EMSDK_VERSION }}
        ./emsdk activate ${{ env.EMSDK_VERSION }}
    - name: Activate Emscripten SDK
      run: |
        cd ~/emsdk
        ./emsdk activate ${{ env.EMSDK_VERSION }}
        source ./emsdk_env.sh
        echo "$EMSDK" >> "$GITHUB_PATH"
        echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
        echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
    - name: Cache depends tarballs
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ${{ github.workspace }}/tools/depends/tarballs
        key: depends-tarballs-wasm-${{ hashFiles('tools/depends/target/*/Makefile') }}
        restore-keys: depends-tarballs-wasm-
    - name: Build depends
      run: |
        source ~/emsdk/emsdk_env.sh
        cd tools/depends
        sh bootstrap
        autoreconf -fi
        ./configure \
          --host=wasm32-unknown-emscripten \
          --with-platform=wasm \
          --prefix=${{ env.WASM_DEPENDS_PREFIX }} \
          --disable-debug
        make -j$(nproc)
    - name: Configure
      run: |
        source ~/emsdk/emsdk_env.sh
        cmake -S . -B build-wasm \
          -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.WASM_DEPENDS_PREFIX }}/wasm32-unknown-emscripten-release/share/Toolchain.cmake
    - name: Build
      run: cmake --build build-wasm -j$(nproc)
