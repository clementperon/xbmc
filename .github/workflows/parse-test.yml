name: make-addons parse test (Windows)
on:
  push:
    branches: [debug-ccache-win]
permissions:
  contents: read
jobs:
  parse:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Old parser (current make-addons.bat loop)
        shell: cmd
        run: |
          (echo @ECHO OFF& echo SET addon=& echo SETLOCAL EnableDelayedExpansion& echo FOR %%%%b IN ^(%%*^) DO ^(SET addon=!addon! %%%%~b^)& echo SET addon) > old.bat
          cmd /c old.bat "^peripheral\.joystick$"
          cmd /c old.bat "pvr\.(hts|iptvsimple)" peripheral.joystick
          cmd /c old.bat peripheral.joystick pvr.*
      - name: New parser
        shell: cmd
        run: |
          cmd /c parse-test.bat peripheral.joystick inputstream.adaptive pvr.*
          cmd /c parse-test.bat pvr.*
          cmd /c parse-test.bat "^peripheral\.joystick$"
          cmd /c parse-test.bat "pvr\.(hts|iptvsimple)" peripheral.joystick
          cmd /c parse-test.bat install clean package win10 a.b
          cmd /c parse-test.bat
          exit /b 0
